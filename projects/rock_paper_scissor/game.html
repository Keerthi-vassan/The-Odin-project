<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissor</title>
</head>
<body>
    <div class="page">
        <div class="info">
            <div id="title">
                <h1>Let's play Rock, Paper, Scissor.</h1>
            </div>
            <div id="round">
                <h3 id="round-number">Round 1</h3>
            </div>
        </div>
        
        <div class="UI">
            <div class="human">
                <h4 class="white_text">Player</h4>
                <img id="player-choice" src="images/placeholder.jpeg" alt="player's selection">
            </div>

            <div class="button_area">
                <div class="points">
                    <h3 id="Score">Score = 0 : 0</h3>
                </div>

                <div class="buttons">
                    <button id="rock">rock</button>
                    <button id="paper">paper</button>
                    <button id="scissor">scissor</button>
                </div>
            </div>

            <div class="computer">
                <h4 class="white_text">Computer</h4>
                <img id="computer-choice" src="images/placeholder.jpeg" alt="computer's selection">
            </div>
        </div>

        <div class="result">
            <h2 id="result-text"></h2>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
